<tr>
<th><label for="author">Name</label></th>
<td><input id="author" name="author" type="text" required maxlength="240" value="{{ author.author|default:'' }}" title="Enter the name or pseudonym the author is best known under. Put lesser known names or pseudonyms in aliases. Use full unicode here and put an ASCII-fied version in aliases. (eg. Brontë, Charlotte)"></td>
</tr>
<tr>
<th><label for="born_floor">Born (earliest)</label></th>
<td><input id="born_floor" name="born_floor" type="number" min="-4000" max="2100" value="{{ author.born_floor|default_if_none:'' }}" title="Year the author was born (earliest estimate). Leave empty if unknown. (eg. 1803, -250)"></td>
</tr>
<tr>
<th><label for="born_ceil">Born (latest)</label></th>
<td><input id="born_ceil" name="born_ceil" type="number" min="-4000" max="2100" value="{{ author.born_ceil|default_if_none:'' }}" title="Year the author was born (latest estimate). Leave empty if unknown. (eg. 1803, -250)"></td>
</tr>
<tr>
<th><label for="died_floor">Died (earliest)</label></th>
<td><input id="died_floor" name="died_floor" type="number" min="-4000" max="2100" value="{{ author.died_floor|default_if_none:'' }}" title="Year the author died (earliest estimate). Leave empty if unknown. (eg. 1803, -250)"></td>
</tr>
<tr>
<th><label for="died_ceil">Died (latest)</label></th>
<td><input id="died_ceil" name="died_ceil" type="number" min="-4000" max="2100" value="{{ author.died_ceil|default_if_none:'' }}" title="Year the author died (latest estimate). Leave empty if unknown. (eg. 1803, -250)"></td>
</tr>
<tr>
<th><label for="note">Note</label></th>
<td><textarea id="note" name="note" maxlength="10000" title="Any note relevant to the cataloging people.">{{ author.note|default:'' }}</textarea>
{% if author.pk %}
<input type="hidden" name="was_author" value="{{ author.author|default:'' }}">
<input type="hidden" name="was_born_floor" value="{{ author.born_floor|default_if_none:'' }}">
<input type="hidden" name="was_born_ceil" value="{{ author.born_ceil|default_if_none:'' }}">
<input type="hidden" name="was_died_floor" value="{{ author.died_floor|default_if_none:'' }}">
<input type="hidden" name="was_died_ceil" value="{{ author.died_ceil|default_if_none:'' }}">
<input type="hidden" name="was_note" value="{{ author.note|default_if_none:'' }}">
{% endif %}
</td>
</tr>

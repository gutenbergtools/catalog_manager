{% extends "base.html" %}
{% block title %}Set Password - {{ brand }}{% endblock %}
{% block content %}
<div class="box auth-box">
<h1>Set your password</h1>
{% if form.errors %}<div class="msg error">Enter your email address.</div>{% endif %}
<form method="post">
{% csrf_token %}
<label for="id_email">Email</label>
<input type="email" name="email" id="id_email" autocomplete="email" required>
<p class="help">We will send a one-time link for choosing a password.</p>
<div class="row"><button class="primary" type="submit">Send link</button></div>
</form>
</div>
{% endblock %}
